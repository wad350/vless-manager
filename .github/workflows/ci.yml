name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.7'
          cache-dependency-path: |
            go.sum
            singbox_src/go.sum

      - name: Test
        run: go test -tags with_utls ./cmd/vless-manager

      - name: Build Keenetic binary
        run: make manager

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: vless-manager-linux-mipsle-softfloat
          path: build/vless-manager
          if-no-files-found: error
