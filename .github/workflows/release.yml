name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            go.sum
            singbox_src/go.sum

      - name: Verify release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          make_version="$(awk '/^VERSION[[:space:]]*:=/ { print $3; exit }' Makefile)"
          if [[ "$version" != "$make_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Makefile VERSION=$make_version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: |
          go test -tags with_utls ./...
          sh -n install.sh
          sh tests/install_test.sh

      - name: Build release assets
        shell: bash
        run: |
          mkdir -p dist
          make clean
          make ipk VERSION="$VERSION" ARCH=mipsel-3.4 GOARCH=mipsle GOMIPS=softfloat
          cp "build/vless-manager_${VERSION}_mipsel-3.4.ipk" dist/
          make clean
          make ipk VERSION="$VERSION" ARCH=aarch64-3.10 GOARCH=arm64 GOMIPS=
          cp "build/vless-manager_${VERSION}_aarch64-3.10.ipk" dist/
          (
            cd dist
            for ipk in *.ipk; do
              sha256sum "$ipk" > "$ipk.sha256"
            done
            sha256sum *.ipk > checksums.txt
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "VLESS Manager $GITHUB_REF_NAME"
