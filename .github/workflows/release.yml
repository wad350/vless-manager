name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            go.sum
            xray_src/go.sum

      - name: Verify release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          make_version="$(awk '/^VERSION[[:space:]]*:=/ { print $3; exit }' Makefile)"
          if [[ "$version" != "$make_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Makefile VERSION=$make_version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: sh tests/check.sh

      - name: Build release assets
        shell: bash
        run: |
          mkdir -p dist
          make clean
          make ipk VERSION="$VERSION" ARCH=mipsel-3.4 GOARCH=mipsle GOMIPS=softfloat
          # Keep symbols in audit copies so unused module packages are not
          # reported as linked code; release IPKs remain stripped.
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat CGO_ENABLED=0 \
            go build -modfile=build/mips-crypto/crypto.mod -trimpath -o "$RUNNER_TEMP/manager-audit" ./cmd/vless-manager
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "$RUNNER_TEMP/manager-audit"
          cp "build/vless-manager_${VERSION}_mipsel-3.4.ipk" dist/
          make clean
          make ipk VERSION="$VERSION" ARCH=aarch64-3.10 GOARCH=arm64 GOMIPS=
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -o "$RUNNER_TEMP/manager-audit" ./cmd/vless-manager
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "$RUNNER_TEMP/manager-audit"
          rm "$RUNNER_TEMP/manager-audit"
          cp "build/vless-manager_${VERSION}_aarch64-3.10.ipk" dist/
          (
            cd dist
            for ipk in *.ipk; do
              sha256sum "$ipk" > "$ipk.sha256"
            done
            sha256sum *.ipk > checksums.txt
          )

      - name: Check release vulnerabilities
        shell: bash
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/vless-manager

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VLESS_MANAGER_RELEASE_DIR="$PWD/dist" VLESS_MANAGER_RELEASE_VERSION="$VERSION" \
            go test -count=1 -run '^TestBuiltReleasePackages$' ./cmd/vless-manager
          awk -v version="$GITHUB_REF_NAME" '
            /^## / { if (active) exit; active = ($0 == "## " version); next }
            active { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "Missing changelog for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --title "VLESS Manager $GITHUB_REF_NAME"
